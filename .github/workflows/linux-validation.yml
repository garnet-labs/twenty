name: Linux validation

on:
  push:
    branches: [ci-linux-validation]

permissions:
  contents: read
  id-token: write

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
      - uses: "garnet-org/action@v2.6.0"
      - uses: "actions/setup-node@v7"
        with:
          node-version: "26.5.1"
          package-manager-cache: false
      - name: "Set up Corepack"
        run: |
          npm install --global corepack
          corepack enable
      - name: "Install dependencies"
        run: |
          yarn config set enableHardenedMode true
          yarn config set enableScripts false
          yarn --immutable --check-cache
      - name: "Build prerequisites"
        run: |
          npx nx run twenty-agent-skills:validate
      - name: "Run checks"
        run: |
          npx nx run twenty-agent-skills:test
