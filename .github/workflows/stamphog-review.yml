name: StampHog Shadow Review

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Fork PR to review after its record finalizes
        type: number
        required: true

permissions: {}

concurrency:
  group: stamphog-review-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.repository == 'garnet-labs/twenty' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'garnet-runtime-review[bot]' &&
        contains(github.event.comment.body, 'garnet:summary')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
    env:
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require finalized evidence bound to the current opted-in head
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(python3 .github/merge-gate/gate.py --ready "$GITHUB_REPOSITORY" "$PR_NUMBER")"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.evidence.outputs.head != ''
        with:
          enable-cache: false
      - name: Evaluate the pinned head without checking it out
        if: steps.evidence.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.STAMPHOG_ANTHROPIC_API_KEY }}
          REVIEW_HEAD: ${{ steps.evidence.outputs.head }}
        run: |
          args=()
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then args+=(--dry-run); fi
          uv run tools/pr-approval-agent/review_pr.py "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --allow-bot-authors --expected-head "$REVIEW_HEAD" --output-json "$RUNNER_TEMP/verdict.json" "${args[@]}"
      - name: Publish the shadow verdict (never an approval review)
        if: steps.evidence.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD: ${{ steps.evidence.outputs.head }}
        run: python3 .github/scripts/stamphog-publish.py "$RUNNER_TEMP/verdict.json" "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_HEAD"
